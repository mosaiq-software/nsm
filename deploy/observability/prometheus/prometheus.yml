global:
    scrape_interval: 15s
    evaluation_interval: 15s

# Targets are generated by nsmd from the node registry (promTargets.ts) and addressed by stable
# internal hostnames (<nodeId>.<internalDomain>), so scraping is IP-less. Prometheus hot-reloads
# these files automatically.
scrape_configs:
    - job_name: 'node'
      file_sd_configs:
          - files:
                - '/etc/nsm/prometheus/targets_node.json'

    - job_name: 'nsmd'
      metrics_path: '/metrics'
      file_sd_configs:
          - files:
                - '/etc/nsm/prometheus/targets_nsmd.json'

    - job_name: 'cadvisor'
      file_sd_configs:
          - files:
                - '/etc/nsm/prometheus/targets_cadvisor.json'
      # Promote NSM container labels to first-class metric labels so the API can filter per
      # deployment (projectInstanceId / serviceInstanceId / projectId / serviceName).
      metric_relabel_configs:
          - source_labels: [container_label_dev_mosaiq_nsm_projectInstanceId]
            target_label: projectInstanceId
          - source_labels: [container_label_dev_mosaiq_nsm_serviceInstanceId]
            target_label: serviceInstanceId
          - source_labels: [container_label_dev_mosaiq_nsm_projectId]
            target_label: projectId
          - source_labels: [container_label_dev_mosaiq_nsm_serviceName]
            target_label: serviceName
