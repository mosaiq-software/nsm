# NSM self-hosted observability stack (LEADER ONLY).
# Brought up by nsmd (ensureObservabilityStack) or bootstrap:
#   docker compose -p nsm-observability -f deploy/observability/docker-compose.yml up -d
services:
    loki:
        image: grafana/loki:3.1.1
        command: -config.file=/etc/loki/local-config.yaml
        ports:
            - '3100:3100'
        volumes:
            - loki-data:/loki
        restart: unless-stopped

    prometheus:
        image: prom/prometheus:v2.54.1
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
        ports:
            - '9090:9090'
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - /etc/nsm/prometheus:/etc/nsm/prometheus:ro
            - prometheus-data:/prometheus
        restart: unless-stopped

    grafana:
        image: grafana/grafana:11.2.0
        ports:
            - '3000:3000'
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
            - GF_SECURITY_ALLOW_EMBEDDING=true
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            - grafana-data:/var/lib/grafana
        depends_on:
            - loki
            - prometheus
        restart: unless-stopped

volumes:
    loki-data:
    prometheus-data:
    grafana-data:
