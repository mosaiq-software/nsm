# Drop-in that makes the host nginx serve NSM-managed sites.
# Install by adding this line inside the http { } block of /etc/nginx/nginx.conf:
#
#     include /etc/nsm/nginx/*.conf;
#
# Only the LEADER renders these confs and terminates 443. Each conf proxies to a backend node by
# its stable internal hostname (<nodeId>.<INTERNAL_DOMAIN>), which the leader keeps mapped to the
# node's current IP in /etc/hosts. This file is provided as a reference for that include directive.
include /etc/nsm/nginx/*.conf;
