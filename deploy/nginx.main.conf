# Drop-in that makes the host nginx serve NSM-managed sites.
# Install by adding this line inside the http { } block of /etc/nginx/nginx.conf:
#
#     include /etc/nsm/nginx/*.conf;
#
# NSM renders one <projectId>.conf per project into /etc/nsm/nginx on EVERY node, so whichever
# node currently holds the VIP can terminate 443 and proxy to the assigned backend node.
#
# This file is provided as a reference for that include directive.
include /etc/nsm/nginx/*.conf;
